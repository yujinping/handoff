[package]
name = "handoff"
version = "0.1.0"
edition = "2021"
description = "跨客户端会话交接 CLI：本地 markdown 任务文档 + git 同步"
authors = ["yujinping"]
license = "MIT"
repository = "https://gitee.com/yujinping8620/handoff"

[[bin]]
name = "handoff"
path = "src/main.rs"

# 依赖极简（§0.3）：不引 git2/libgit2（直接 shell-out git），不引正则库。
[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
toml = "0.8"
